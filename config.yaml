# 柠泽资源站配置文件
# YAML 支持注释，后台保存时会保留本模板结构并回填最新配置值。

server_address: ""
server_port: 8080

# 定时扫描 cron 表达式（分钟粒度）
check_cron: '*/10 * * * *'

# Release 资源存储目录（相对项目根目录）
storage_path: download

# GitHub Token，可留空并使用环境变量 GITHUB_TOKEN 覆盖
github_token: ""

# 对外下载地址基准（为空时回退到 server_address）
download_url_base: ""

# 单文件下载超时（分钟），Git 镜像同步也复用此超时
download_timeout_minutes: 40
concurrent_downloads: 3

proxy_url: ""
asset_proxy_url: ""
xget_domain: https://xget.xi-xu.me
xget_enabled: true

admin_enabled: true
admin_user: admin
admin_password: $2a$04$UsOkJmLf1nYOQ7rDY4Pp3.3ou68RFHdzbfR3x4HSNZgqdDA7bJnay
admin_max_retries: 10
admin_lock_duration: 120

two_factor_enabled: false
two_factor_secret: ""

# PoW 下载验证（替代极验，自动验证客户端正规性）
pow_enabled: true
pow_algorithm: PBKDF2-SHA256
pow_cost: 500
pow_key_length: 32
pow_difficulty: 6
pow_challenge_ttl: 10m
# PoW HMAC 签名密钥；留空时启动随机生成（挑战内存态+短 TTL，重启即失效，无需持久化）
pow_hmac_secret: ""

# 下载授权令牌有效期（解析为 Go duration，如 5m / 30s）
download_token_ttl: 10m

traffic_limit_gb: 0
bandwidth_limit_mbps: 200
ban_record_file: banned_ips.json
external_blacklist_url: https://bcr.pbh-btn.ghorg.ghostchu-services.top/combine/all.txt
appeal_contact: QQ群 https://qm.qq.com/q/FOGt99aayY

mysql_host: ""
mysql_port: 3306
mysql_user: ""
mysql_password: ""
mysql_database: ""
mysql_migration: false

database_mode: auto

postgres_host: ""
postgres_port: 5432
postgres_user: ""
postgres_password: ""
postgres_database: ""
postgres_sslmode: disable
postgres_migration_batch: 200
postgres_migration_delay: 250ms

self_update_enabled: false
self_update_repo_url: ""
self_update_channel: notify
self_update_check_cron: ""
self_update_auto_restart: false

# 启动器列表
# mode:
#   - release: 仅同步 Release 资源
#   - clone / all: 已废弃（Git 镜像功能已移除），仅为兼容旧配置保留
launchers:
  - name: mirror
    source_url: https://github.com/ningzestudio/lemwood-mirror
    mode: release
    include_prerelease: true
    max_versions: 0
